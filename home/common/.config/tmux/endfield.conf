# Endfield palette for tmux.
#
# The status line sits at the top, where waybar does, and answers the same way:
# a near-black ground, window names in the muted step, and the current one in
# the accent under a rule. waybar draws that rule as a border-top; a status
# line has one row to say it in, so here it is an overline.
#
# Yellow stays rare. It marks the current window, the focused pane's border and
# a selection — never a whole bar, or it stops meaning "this one".

set -g status-style "bg=#0B1118,fg=#8A99A6"

# The session, marked the way a section heading is: an accent tick, then the
# name in the reading colour rather than in the accent itself.
set -g status-left "#[fg=#FFD400]▎#[fg=#AAB7C2,bold]#S #[default]"
set -g status-left-length 30

set -g window-status-separator ""
set -g window-status-format "#[fg=#8A99A6] #I #W "
set -g window-status-current-format "#[fg=#FFD400,overline] #I #W "
set -g window-status-activity-style "fg=#FF6B45"
set -g window-status-bell-style "fg=#FF6B45,bold"

# One highlight at a time, the rule the shell's cursor follows: only the
# focused pane's border is lit.
set -g pane-border-style "fg=#3A4A59"
set -g pane-active-border-style "fg=#FFD400"
set -g display-panes-colour "#3A4A59"
set -g display-panes-active-colour "#FFD400"

# Anything sitting on an accent fill takes the deepest surface as its
# foreground: white fails on this yellow.
set -g message-style "bg=#FFD400,fg=#0B1118,bold"
set -g message-command-style "bg=#1B2733,fg=#E8EDF1"
set -g mode-style "bg=#FFD400,fg=#0B1118"
set -g copy-mode-selection-style "bg=#FFD400,fg=#0B1118,bold"

set -g clock-mode-colour "#FFD400"
