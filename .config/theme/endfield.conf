# Endfield palette for Hyprland and hyprlock.

# Neutrals, darkest to lightest
$base = 171717
$charcoal = 313739
$overlay = 565656
$mediumGray = 7E807C
$lightGray = A0AAA9
$text = DFE3E3

# Accents
$oliveGreen = 657136
$feintYellow = F8F546
$brightYellow = FFFA00

# Status
$success = A3B84A
$critical = E95460

# Hyprland substitutes a variable as one whole token and cannot concatenate an
# alpha suffix onto one, so anything needing transparency is spelled out here.
$borderActive = rgba(FFFA0088)
$borderInactive = rgba(313739AA)
$lockAccent = rgba(FFFA00E6)
