# Endfield palette for Hyprland and hyprlock.

# Surfaces, deepest first
$bgDeep = 0B1118
$bgPanel = 111A23
$bgRaised = 1B2733
$line = 3A4A59

# Text, brightest first. $textMuted is the metadata and serial register.
$textPrimary = E8EDF1
$textSecondary = AAB7C2
$textMuted = 8A99A6

# accent fills and marks; $accentSoft is the same hue as a foreground
$accent = FFD400
$accentSoft = FFE14D

# Status
$info = 4B9BFF
$success = 8BD32E
$danger = FF6B45

# Hyprland substitutes a variable as one whole token and cannot concatenate an
# alpha suffix onto one, so anything needing transparency is spelled out here.
$borderActive = rgba(FFD400CC)
$borderInactive = rgba(3A4A5988)
$lockAccent = rgba(FFD400E6)
