set-option -sa terminal-overrides ",xterm*:Tc"
set -g base-index 1
set -g renumber-windows on
set -g automatic-rename off
bind n display-popup -E "tmux-new-window #{pane_current_path}"
set-option -g status-position top

unbind C-b
set-option -g prefix C-space
bind C-space send-prefix

set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'wl-copy' 
bind -T prefix v copy-mode

set -g status-right "#{?client_prefix,#[fg=black bg=yellow bold] C-k:last-pane  c:new  ,:ren  x:kill  z:zoom  v:copy  r:reload  ?:help #[default],}"
set -g status-right-length 120

unbind l
bind -T prefix C-j last-window
bind -T prefix C-k last-pane
bind -T root M-h previous-window
bind -T root M-l next-window
bind -T root M-Tab last-window
bind r source-file $XDG_CONFIG_HOME/tmux/tmux.conf \; display-message "config reload"

bind ? display-popup -x "#{e|-:#{window_width},44}" -y "#{e|-:#{window_height},24}" -w 42 -h 22 -E "printf ' ⌨  Shortcuts\n ─── Navigation ──────────────────────\n M-h/l    Prev/next window\n C-k      Last pane\n [0-9]    Switch to window N\n ─── Windows & Panes ─────────────────\n c        New window\n ,        Rename window\n &        Kill window\n x        Kill pane\n z        Zoom pane\n ─── Copy mode ───────────────────────\n v        Enter copy mode\n v        Begin selection\n y        Copy selection\n ─── Other ───────────────────────────\n r        Reload config\n ?        This menu\n'; read"
