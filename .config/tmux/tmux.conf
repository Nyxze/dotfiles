set-option -sa terminal-overrides ",xterm*:Tc"
set -g base-index 1
set -g renumber-windows on
set -g automatic-rename off
set -g extended-keys on
bind n display-popup -E "tmux-new-window #{pane_current_path}"

# The three menus. `-b none` because fzf draws its own boxes, and the popup
# background matches the panel surface so the two do not step on each other.
# s and w replace choose-tree: the same job, filterable, and s also reaches the
# SSH hosts and creates a session from a name it does not find.
bind s display-popup -w 64 -h 16 -b none -s "bg=#111A23" -E "tmux-sessions"
bind w display-popup -w 64 -h 16 -b none -s "bg=#111A23" -E "tmux-windows"
bind ? display-popup -w 64 -h 32 -b none -s "bg=#111A23" -E "tmux-help"
set-option -g status-position top
source-file ~/.config/tmux/endfield.conf

unbind C-b
set-option -g prefix C-space
bind C-space send-prefix

set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi M-w send-keys -X select-word
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'wl-copy' 
bind -T prefix v copy-mode

set -g status-right "#{?client_prefix,#[fg=#0B1118 bg=#FFD400 bold] C-k:last-pane  c:new  ,:ren  x:kill  z:zoom  v:copy  r:reload  ?:help #[default],}"
set -g status-right-length 120

unbind l
bind -T prefix C-j last-window
bind -T prefix C-k last-pane
bind -T root M-h previous-window
bind -T root M-l next-window
bind -T root M-Tab last-window
bind -T root C-Tab send-keys C-Tab
bind e send-keys "nvim ." Enter
bind r source-file $XDG_CONFIG_HOME/tmux/tmux.conf \; display-message "config reload"
