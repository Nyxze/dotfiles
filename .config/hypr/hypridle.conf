general {
    # The lock screen is a shell surface; locking twice is a no-op on its side,
    # so several listeners firing together need no guard here. hyprlock stays
    # as the fallback for a session where the shell is not running.
    lock_cmd = qs -c endfield ipc call lock lock || uwsm app -- hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
    timeout = 300
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

listener {
    timeout = 900
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
